version: "3.8"

services:
  # Service 1: Ollama Server (Chạy LLM và Embedding Model Local)
  ollama:
    image: ollama/ollama:latest
    container_name: chatbot-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    # Nếu máy bạn có GPU NVIDIA, hãy bỏ comment phần deploy dưới đây để tăng tốc tối đa:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # Service 2: Tự động pull model khởi tạo (Qwen 2.5 & Nomic Embed Text) khi vừa dựng container
  model-puller:
    image: curlimages/curl:latest
    container_name: chatbot-model-puller
    depends_on:
      - ollama
    entrypoint: >
      sh -c "
        echo 'Đang chờ Ollama server sẵn sàng...';
        until curl -s http://ollama:11434/api/tags > /dev/null; do
          sleep 2;
        done;
        echo 'Ollama đã online! Tiến hành kéo các model cần thiết...';
        echo '1. Kéo model embeddings: nomic-embed-text...';
        curl -s -X POST http://ollama:11434/api/pull -d '{\"name\": \"nomic-embed-text\"}';
        echo '';
        echo '2. Kéo model LLM: qwen2.5:1.5b...';
        curl -s -X POST http://ollama:11434/api/pull -d '{\"name\": \"qwen2.5:1.5b\"}';
        echo '';
        echo 'Hoàn tất khởi tạo model!';
      "
    restart: "no"

  # Service 3: Ứng dụng Streamlit RAG Chatbot
  rag-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chatbot-rag-app
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_DEFAULT_MODEL=qwen2.5:1.5b
      - OLLAMA_EMBED_MODEL=nomic-embed-text
      - CHUNK_SIZE=800
      - CHUNK_OVERLAP=150
    volumes:
      # Mount thư mục tài liệu để người dùng có thể thêm/xem trực tiếp từ host
      - ./data/documents:/app/data/documents
      # Mount vector DB để dữ liệu đã vector hóa không bị mất khi restart container
      - vector_db_data:/app/data/vector_db
    depends_on:
      - ollama

volumes:
  ollama_models:
    name: chatbot_ollama_models
  vector_db_data:
    name: chatbot_vector_db_data
